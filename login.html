<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入协作 · Comparison Viewer</title><link rel="icon" type="image/png" href="/assets/brand.png"><link rel="stylesheet" href="css/style.css"><script defer src="js/login.js"></script></head>
<body class="login-page"><main class="login-card"><img class="login-logo" src="/assets/brand.png" alt="Comparison Viewer 标识"><span class="login-eyebrow">SHARED IMAGE COMPARISON</span><h1>一起找到值得展示的细节。</h1><p class="hint">Comparison Viewer<br>按昵称独立筛选，收藏和备注集中保存到主机。</p>
<form id="login-form"><label>访问口令<input id="access-code" type="password" required maxlength="128" autocomplete="off" placeholder="由主机管理员提供"></label><label>筛选人昵称<input id="nickname" required minlength="2" maxlength="24" autocomplete="off" placeholder="例如：小张 / 王同学"></label><details><summary>在新浏览器中恢复已有昵称</summary><label>身份恢复码<input id="recovery-code" type="password" maxlength="128" autocomplete="off" placeholder="首次加入时获得的恢复码"></label><p class="hint">昵称已存在时须填写恢复码，防止他人覆盖你的筛选结果。</p></details><button type="submit" id="login-submit" class="primary">进入协作工作台 →</button></form>
<section id="recovery-card" hidden><h2>请保存你的身份恢复码</h2><p>更换电脑、退出登录或清除浏览器数据后，用相同昵称和恢复码找回你的标记。</p><label>恢复码<input id="new-recovery" readonly></label><button id="save-recovery">下载身份备份</button><button id="enter-viewer" class="primary">进入查看器 →</button></section>
<p id="login-error" role="status"></p><footer class="hint">主机提供原始图片，查看操作不改动图片内容。<br>HTTP 入口适合可信局域网，请勿公开转发访问口令。</footer></main></body></html>
